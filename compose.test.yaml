services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: hirehelper_test
    ports: ['127.0.0.1:55432:5432']
    volumes: ['test-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d hirehelper_test']
      interval: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:58025:8025', '127.0.0.1:51025:1025']
volumes:
  test-postgres:
